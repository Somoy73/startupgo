# StartupGo agent configuration. Secrets go in .env (see .env.example).

[llm]
# Two models; every command and the scrape page can use either. `default` is used when none is chosen:
#   startup-agent --llm gemini graph ...      the /agent-scraper page has a Model menu
# Keys here are shared; each [llm.<name>] table adds or overrides keys.
default = "nvidia"
temperature = 0.0
# Sections extracted together in one LLM call: 3 calls per startup instead of 10.
# For one call per section (slower, slightly sharper quotes) use [["A"], ["B"], ..., ["J"]].
section_groups = [["A", "B", "H", "I"], ["C", "D", "E"], ["F", "G", "J"]]

# NVIDIA's hosted API (free keys at build.nvidia.com; the Search module uses the same endpoint). Nemotron 3.5 Super VL
# answered in 3-5 s with thinking off in our tests, follows JSON schemas and reads images (screenshots, scanned pages,
# charts). Free-tier latency varies: some calls took over a minute.
[llm.nvidia]
provider = "openai-compatible"
model = "nvidia/nemotron-3.5-super-vl-120b-a12b"
api_key_env = "NVIDIA_API_KEY"
endpoint = "https://integrate.api.nvidia.com/v1"
requests_per_minute = 30       # NVIDIA free tier ~40; 0 = no pacing. All calls (extraction, judge) share one pacer
reasoning = false              # Nemotron "thinking" before the answer (~80 s per call in our test); extraction needs none
multimodal = true              # the model reads images (image_url)
max_tokens = 16384             # answer budget per call; long listings give long answers (a cut-off answer is retried on halves)
timeout = 300                  # seconds per call; free-tier calls sometimes took over 2 min (a timeout is retried, then split)

# Google Gemini. Also reads PDFs the agent can't read itself (scanned, without a text layer). Small free tier.
[llm.gemini]
provider = "gemini"
model = "gemini-3.5-flash-lite"
api_key_env = "GEMINI_API_KEY"
requests_per_minute = 10       # your plan's limit: free tier ~10, paid tiers far higher; 0 = no pacing
thinking = "minimal"           # extraction needs no reasoning; "minimal" is fastest and cheapest ("" = model default)

[crawl]
max_pages = 12                 # pages per startup website, homepage included
page_chars = 15000             # text kept per page
section_chars = 30000          # document text sent with each extraction call
timeout = 30.0
delay = 1.5                    # seconds between requests
browser = false                # render pages with Chrome; options in [browser]
respect_robots = true

# Web search for independent pages about each startup (news, partners, programmes).
# Results are fetched through the scraper and go through the same quote-verified extraction.
[search]
# "gemini": Google Search via Gemini grounding, with the [llm.gemini] key, whichever model extracts (so NVIDIA + Gemini
# search works). The free tier may not include grounding (HTTP 429): enable billing or switch. "brave": Brave Search API
# (key in .env as BRAVE_API_KEY). "none": the startup's website, discovery data and given URLs only.
provider = "gemini"
api_key_env = "BRAVE_API_KEY"  # only for provider = "brave"
results_per_query = 5
max_pages = 6                  # search-result pages fetched per startup
queries = [                    # {name} = startup name, {domain} = website domain
    '"{name}" startup funding investment',
    '"{name}" pilot partnership customers',
    '"{name}" news award',
]

# The judge reviews both agents' work and sends it back with instructions when it isn't good enough.
[judge]
max_research_rounds = 1        # redo passes the judge may request from the research agent (each costs LLM calls)
max_evaluation_rounds = 1      # redo passes the judge may request from the evaluation agent
check_support = true           # LLM check that every quote really supports its extracted value
max_rejected_per_section = 2   # more rejected values in a section than this → redo the section
min_confidence = 0.35          # weaker assessments are sent back for targeted research
required_fields = ["dev_stage", "customer_validation", "business_model", "impact_claim"]

# Chrome options when [crawl] browser = true (passed to the scraper module).
[browser]
driver = "undetected"
stealth = true
headless = true
chrome_version = 0
settle_seconds = 2.0

[paths]
cache_dir = "cache"            # raw pages and LLM outputs, for free and reproducible reruns
output_dir = "output"          # startups/<id>.json entries and index.json
system_prompt = "prompts/system.md"
section_prompt = "prompts/section.md"
judge_prompt = "prompts/judge.md"

# Investment-potential weights per criterion (a mentor question; defaults are equal).
[weights]
Market = 1.0
Product = 1.0
Team = 1.0
"Business model" = 1.0
Competition = 1.0
"Marketing and distribution" = 1.0
Financials = 1.0
Tech = 1.0
"Deal dynamics" = 1.0
Impact = 1.0

# Scores are read from and stored in the StartupGo database (DB/unified.sql): each run is an
# assessments row (engine 'agent'); judge-approved entries also add the startup (entities) and their
# facts. STARTUPGO_DB overrides the path.
[database]
store = true
path = "../../DB/startupgo_unified.db"

# `startup-agent pipeline`: database startups without a usable score in the assessments table, plus
# startups discovered below, are researched, judged and stored. Run process-storage afterwards (refresh.py does both).
[pipeline]
limit = 5                      # startups researched per run (each costs a few LLM calls)
max_age_days = 30              # a startup the agent researched is left alone this many days, whatever the result
discover = [                   # discovery sources; new leads are added as startups once the judge accepts them
    # { source = "wellfound", url = "https://wellfound.com/startups/industry/aquaculture", limit = 10 },
]
