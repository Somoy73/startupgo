[project]
name = "scraper"
version = "0.1.0"
description = "Public startup discovery and page fetching for StartupGo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "selenium>=4.51.0",
    "selenium-stealth>=1.0.6",
    "selenium-wire>=5.1.0",
    "undetected-chromedriver>=3.5.5",
    "xvfbwrapper>=0.2.35",
]

# Installable so other modules (e.g. Modules/Agent) can depend on it by path.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scraper"]

