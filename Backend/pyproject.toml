[project]
name = "startupgo-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.15.0",
    "fastapi==0.120.0",
    "pydantic==2.12.5",
    "uvicorn==0.38.0",
    "startup-agent",
    "startup-search",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
]

[tool.uv.sources]
# Research jobs run the agent in-process; it needs the scraper, which is a workspace member there.
scraper = { path = "../Modules/Scraper", editable = true }
startup-agent = { path = "../Modules/Agent", editable = true }
startup-search = { path = "../Modules/Search", editable = true }
